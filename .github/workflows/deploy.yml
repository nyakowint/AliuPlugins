name: Deploy

concurrency:
  group: "deploy"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v6
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x ./gradlew
          ./gradlew make :generateUpdaterJson

          cp $GITHUB_WORKSPACE/src/*/build/outputs/*.zip $GITHUB_WORKSPACE/builds/
          cp $GITHUB_WORKSPACE/src/build/outputs/updater.json $GITHUB_WORKSPACE/builds/

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          if-no-files-found: error
          path: ${{ github.workspace }}/src/*/build/outputs/*.zip

      - name: Push builds
        id: push
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "Your mom"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Aliucord fetches updater.json and plugin zips through jsDelivr, which caches them for hours
      - name: Purge jsDelivr cache
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/builds
          for file in $(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files); do
            # Plugins reference @refs/heads/builds, purge both ref forms to be safe
            for ref in builds refs/heads/builds; do
              curl -sS --retry 3 --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@$ref/$file" || echo "Failed to purge $file"
            done
            echo
          done
